about:
  - "I am an M.Tech. (Research) student in Computer Science and Engineering at the Indian Institute of Science, advised by Prof. Arkaprava Basu."
  - "I build analysis and systems tools for GPU software, with current work spanning LLVM/NVVM program analysis, CUDA concurrency, and memory safety."

about_page:
  title: "About"
  intro: "I work at the boundary of compilers and computer systems, where program analysis can make parallel software safer and easier to optimize."
  sections:
    - title: "Research focus"
      paragraphs:
        - "My current research develops analyses over LLVM and NVVM IR to reason about control flow, data flow, and memory behavior in CUDA programs. I am particularly interested in GPU correctness, concurrency, race detection, and memory safety."
        - "I prefer systems work that ends in a usable implementation: an analysis pass, an instrumentation pipeline, a runtime, or a kernel that can be measured on real workloads."
    - title: "Education"
      paragraphs:
        - "I am pursuing an M.Tech. (Research) in Computer Science and Engineering at IISc Bengaluru. I completed my B.Tech. in Computer Science and Engineering at VIT Bhopal University with a CGPA of 9.13/10."
    - title: "Technical range"
      paragraphs:
        - "Languages: C, C++, CUDA C/C++, Python, and SQL. Systems and compiler tools: LLVM, LLVM IR, NVVM, MLIR, Linux kernel internals, eBPF/libbpf, CMake, Nsight Compute, and Nsight Systems."
        - "GATE CS & IT 2024: All India Rank 175, score 831."

